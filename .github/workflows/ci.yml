name: Chess Training CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Frontend build and test
  frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run frontend linting
      working-directory: ./frontend
      run: npm run lint
      
    - name: Run frontend type checking
      working-directory: ./frontend
      run: npm run type-check
      
    - name: Run frontend tests
      working-directory: ./frontend
      run: npm run test:coverage
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      
    - name: Upload frontend build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/

  # Backend build and test
  backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Run backend linting
      working-directory: ./backend
      run: npm run lint
      
    - name: Run backend type checking
      working-directory: ./backend
      run: npm run type-check
      
    - name: Run backend tests
      working-directory: ./backend
      run: npm run test:coverage
      
    - name: Build backend
      working-directory: ./backend
      run: npm run build

  # Electron build (depends on frontend and backend)
  electron:
    runs-on: ${{ matrix.os }}
    needs: [frontend, backend]
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: electron/package-lock.json
        
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
        
    - name: Install electron dependencies
      working-directory: ./electron
      run: npm ci
      
    - name: Build Electron app
      working-directory: ./electron
      run: npm run build
      
    - name: Package Electron app
      working-directory: ./electron
      run: npm run package
      
    - name: Upload Electron packages
      uses: actions/upload-artifact@v4
      with:
        name: electron-${{ matrix.os }}
        path: electron/dist/

  # Integration tests (runs after all builds complete)
  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend, electron]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install root dependencies
      run: npm ci
      
    - name: Run integration tests
      run: npm run test:integration
      
    - name: Run end-to-end tests
      run: npm run test:e2e

  # Security and quality checks
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run dependency audit (frontend)
      working-directory: ./frontend
      run: npm audit --audit-level moderate
      continue-on-error: true
      
    - name: Run dependency audit (backend) 
      working-directory: ./backend
      run: npm audit --audit-level moderate
      continue-on-error: true
      
    - name: Run dependency audit (electron)
      working-directory: ./electron
      run: npm audit --audit-level moderate
      continue-on-error: true

  # Deploy to staging (only on main branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [integration, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to staging
      run: echo "Deploying to staging environment..."
      # Add actual deployment steps here
      
  # Create release (only on version tags)
  release:
    runs-on: ubuntu-latest
    needs: [integration, security]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          electron-ubuntu-latest/**/*
          electron-windows-latest/**/*
          electron-macos-latest/**/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}